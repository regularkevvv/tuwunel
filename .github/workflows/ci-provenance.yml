name: ci-provenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    paths:
      - "src/**"
      - "Cargo.*"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "ci/cyclonedx.pin"
      - "ci/install-cyclonedx.sh"
      - "ci/sbom.sh"
      - "ci/repro-build.sh"
      - "ci/tests/test_provenance.py"
      - ".github/workflows/ci-provenance.yml"

permissions:
  contents: read

concurrency:
  group: ci-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: "2"
      REPRO_PROFILE: release
      REPRO_PACKAGE: tuwunel
    outputs:
      sbom: ${{ steps.sbom.outputs.sbom }}
      binary: ${{ steps.repro.outputs.binary }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Set evidence directory
        run: echo "PROVENANCE_OUT=$RUNNER_TEMP/provenance" >> "$GITHUB_ENV"
      - name: Verify provenance driver controls
        run: python3 -m unittest discover -s ci/tests -v
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang liburing-dev pkg-config
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Install checksum-pinned CycloneDX
        run: bash ci/install-cyclonedx.sh ci/cyclonedx.pin "$RUNNER_TEMP/cyclonedx"
      - name: Generate homeserver SBOM
        id: sbom
        run: bash ci/sbom.sh
      - name: Double-build and compare digests
        id: repro
        run: bash ci/repro-build.sh
      - name: Upload provenance evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-provenance
          path: |
            ${{ runner.temp }}/provenance/homeserver-sbom.tar.gz
            ${{ runner.temp }}/provenance/reproducibility.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve a failed comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-diagnostics
          path: ${{ runner.temp }}/provenance/diagnostics/
          if-no-files-found: ignore
          retention-days: 1

  provenance-evidence:
    needs: provenance
    name: provenance ${{ needs.provenance.outputs.sbom }} ${{ needs.provenance.outputs.binary }} ${{ needs.provenance.outputs.artifact }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm provenance digests
        env:
          SBOM: ${{ needs.provenance.outputs.sbom }}
          BINARY: ${{ needs.provenance.outputs.binary }}
          ARTIFACT: ${{ needs.provenance.outputs.artifact }}
        run: |
          [[ "$SBOM" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BINARY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          echo "SBOM SHA-256 $SBOM; reproducible binary SHA-256 $BINARY; artifact $ARTIFACT"
